# Delays the projector so it lines up with the JBL's Bluetooth latency.
# Measured with a mic: JBL arrives 165 ms after the projector. Tune "Delay (s)".
context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "Projector (delayed)"
      media.name = "Projector (delayed)"
      filter.graph = {
        nodes = [
          { type = builtin, name = delay, label = delay
            config = { "max-delay" = 1.0 }
            control = { "Delay (s)" = 0.165 } }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "projector_delayed"
        media.class = Audio/Sink
        priority.session = 0
      }
      playback.props = {
        node.name = "projector_delayed.output"
        node.passive = true
        target.object = "alsa_output.pci-0000_02_00.1.hdmi-stereo-extra2"
      }
    }
  }
]
