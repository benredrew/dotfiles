# "Speakers + Projector": plays to the JBL Charge 5 and the projector at once.
# Outputs are added/removed automatically as each device appears/disappears.
context.modules = [
  {
    name = libpipewire-module-combine-stream
    args = {
      combine.mode = sink
      node.name = "combined_speakers"
      node.description = "JBL + Projector"
      combine.props = { audio.position = [ FL FR ] }
      stream.props = { stream.dont-remix = true }
      stream.rules = [
        {
          matches = [
            { media.class = "Audio/Sink", node.name = "~bluez_output.*", node.description = "JBL Charge 5" }
            { media.class = "Audio/Sink", node.name = "projector_delayed" }
          ]
          actions = { create-stream = { } }
        }
      ]
    }
  }
]
